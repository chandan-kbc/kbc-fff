<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: #0d0033; color: white; text-align: center; font-family: sans-serif; padding: 10px; margin: 0; }
        .container { border: 3px solid #ffd700; padding: 15px; border-radius: 20px; background: linear-gradient(180deg, #1a0066 0%, #0d0033 100%); min-height: 92vh; display: flex; flex-direction: column; justify-content: center; }
        h1 { color: #ffd700; text-shadow: 2px 2px 5px #000; font-size: 18px; margin: 5px 0; }
        .timer-val { font-size: 55px; color: #ffff00; font-weight: bold; margin: 5px 0; min-height: 65px; }
        #question-text { font-size: 18px; color: #fff; font-weight: bold; margin-bottom: 20px; line-height: 1.4; min-height: 70px; padding: 0 5px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; display: none; }
        .btn { background: #2a0099; color: white; border: 1.5px solid #ffd700; padding: 18px 5px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .selected { background: #ffd700 !important; color: #000 !important; }
        .action-area { display: none; justify-content: space-around; margin-top: 15px; width: 100%; }
        #clear-btn { background: #dc3545; color: white; padding: 12px 25px; border-radius: 8px; border: none; font-weight: bold; }
        #ok-btn { background: #28a745; color: white; padding: 12px 50px; border-radius: 8px; border: 2px solid #fff; font-weight: bold; font-size: 18px; }
        #start-btn { background: #28a745; color: white; padding: 25px; border-radius: 15px; font-size: 22px; border: none; font-weight: bold; width: 85%; margin: 80px auto; }
        #result-box { display: none; margin-top: 15px; padding: 15px; border: 2px solid #ffd700; border-radius: 15px; text-align: left; background: rgba(0,0,0,0.95); line-height: 1.5; }
        .fact-box { margin-top: 10px; border-top: 1px solid #555; padding-top: 10px; color: #ddd; font-size: 13px; text-align: justify; }
    </style>
</head>
<body>

<div class="container">
    <h1>FASTEST FINGER FIRST</h1>
    <div id="q-count" style="color: #aaa; font-size: 12px;">प्रगति: 0/50</div>
    <div class="timer-val" id="timer">10</div>
    <button id="start-btn" onclick="initiateGame()">खेल शुरू करें</button>

    <div id="game-ui" style="display:none;">
        <p id="question-text"></p>
        <div class="options-grid" id="options-container"></div>
        <div id="current-tap" style="margin: 10px 0; color: yellow; font-weight: bold; min-height: 25px;">क्रम: </div>
        <div class="action-area" id="controls">
            <button id="clear-btn" onclick="resetSelection()">Clear</button>
            <button id="ok-btn" onclick="verifySequence()">OK</button>
        </div>
    </div>

    <div id="result-box">
        <h3 id="res-status" style="text-align:center;"></h3>
        <p><b>आपका उत्तर:</b> <span id="user-ans"></span></p>
        <div id="detailed-expl" class="fact-box"></div>
        <button class="btn" onclick="nextRound()" style="background:#fff; color:#000; margin: 15px auto; width: 100%;">अगला प्रश्न</button>
    </div>
</div>

<script>
    const questionsPool = [
        {q: "भारत के इन राज्यों को उनके स्थापना वर्ष (पहले से बाद) के अनुसार लगाएं:", opt: ["आंध्र प्रदेश", "हरियाणा", "गोवा", "तेलंगाना"], correct: [0,1,2,3], expl: "आंध्र (1956) ➔ हरियाणा (1966) ➔ गोवा (1987) ➔ तेलंगाना (2014)"},
        {q: "इन मानव अंगों को शरीर के ऊपर से नीचे (Top to Bottom) के क्रम में लगाएं:", opt: ["मस्तिष्क", "हृदय", "अमाशय", "घुटने"], correct: [0,1,2,3], expl: "मस्तिष्क ➔ हृदय ➔ अमाशय ➔ घुटने"},
        {q: "इन भारतीय करेंसी नोटों के आकार (छोटा से बड़ा) के अनुसार लगाएं:", opt: ["₹10", "₹50", "₹100", "₹500"], correct: [0,1,2,3], expl: "जैसे-जैसे मूल्य बढ़ता है, नोट की लंबाई भी बढ़ती है।"},
        {q: "इन ओलंपिक पदकों को (महत्व के अनुसार) कम से अधिक के क्रम में लगाएं:", opt: ["कांस्य", "रजत", "स्वर्ण", "विश्व रिकॉर्ड"], correct: [0,1,2,3], expl: "कांस्य (Bronze) ➔ रजत (Silver) ➔ स्वर्ण (Gold) ➔ विश्व रिकॉर्ड"},
        {q: "इन गैसों को वायुमंडल में मात्रा (कम से अधिक) के अनुसार लगाएं:", opt: ["कार्बन डाइऑक्साइड", "आर्गन", "ऑक्सीजन", "नाइट्रोजन"], correct: [0,1,2,3], expl: "CO2 (0.04%) ➔ आर्गन (0.9%) ➔ ऑक्सीजन (21%) ➔ नाइट्रोजन (78%)"},
        {q: "इन खेल ट्रोफियों को उनके संबंधित खेल के अनुसार वर्णमाला क्रम में लगाएं:", opt: ["एशेज", "डूरंड", "रंजी", "विम्बलडन"], correct: [0,1,2,3], expl: "एशेज (क्रिकेट) ➔ डूरंड (फुटबॉल) ➔ रंजी (क्रिकेट) ➔ विम्बलडन (टेनिस)"},
        {q: "इन मुगल शासकों के पुत्रों को जन्म क्रम में लगाएं (अकबर के वंशज):", opt: ["जहाँगीर", "शाहजहाँ", "दारा शिकोह", "औरंगजेब"], correct: [0,1,2,3], expl: "जहाँगीर ➔ शाहजहाँ ➔ दारा शिकोह ➔ औरंगजेब"},
        {q: "इन शहरों को उनके ऐतिहासिक स्थापना के आधार पर पुराने से नए में लगाएं:", opt: ["पटना", "दिल्ली", "मुंबई", "चंडीगढ़"], correct: [0,1,2,3], expl: "पटना (प्राचीन) ➔ दिल्ली ➔ मुंबई (औपनिवेशिक) ➔ चंडीगढ़ (आधुनिक)"},
        {q: "इन भारतीय राज्यों को समुद्र तट की लंबाई (कम से अधिक) में लगाएं:", opt: ["गोवा", "पश्चिम बंगाल", "महाराष्ट्र", "गुजरात"], correct: [0,1,2,3], expl: "गोवा (101km) ➔ प. बंगाल ➔ महाराष्ट्र ➔ गुजरात (1214km)"},
        {q: "इन सौर मंडल की घटनाओं को क्रम से लगाएं:", opt: ["सूर्य उदय", "दोपहर", "सूर्यास्त", "मध्यरात्रि"], correct: [0,1,2,3], expl: "सूर्य उदय ➔ दोपहर ➔ सूर्यास्त ➔ मध्यरात्रि"},
        {q: "इन भारतीय सेना के रैंक को छोटे से बड़े क्रम में लगाएं:", opt: ["लेफ्टिनेंट", "कैप्टन", "मेजर", "कर्नल"], correct: [0,1,2,3], expl: "लेफ्टिनेंट ➔ कैप्टन ➔ मेजर ➔ कर्नल"},
        {q: "इन धातुओं को उनकी क्रियाशीलता (कम से अधिक) में लगाएं:", opt: ["सोना", "तांबा", "लोहा", "मैग्नीशियम"], correct: [0,1,2,3], expl: "सोना (निष्क्रिय) ➔ तांबा ➔ लोहा ➔ मैग्नीशियम"},
        {q: "इन दिनों को सप्ताह के क्रम में पहले से बाद में लगाएं:", opt: ["मंगलवार", "बुधवार", "गुरुवार", "शुक्रवार"], correct: [0,1,2,3], expl: "सीधा सप्ताह का क्रम है।"},
        {q: "इन महापुरुषों के निर्वाण स्थल को दक्षिण से उत्तर की ओर लगाएं:", opt: ["गांधी (दिल्ली)", "अंबेडकर (दादर)", "नेहरू (दिल्ली)", "राजा राममोहन राय (ब्रिस्टल)"], correct: [0,1,2,3], expl: "दादर ➔ दिल्ली (राजघाट) ➔ दिल्ली (शांतिवन) ➔ ब्रिस्टल (UK)"},
        {q: "इन राज्यों को साक्षरता दर (कम से अधिक) में लगाएं:", opt: ["बिहार", "झारखंड", "पंजाब", "केरल"], correct: [0,1,2,3], expl: "बिहार ➔ झारखंड ➔ पंजाब ➔ केरल"},
        {q: "इन क्रिकेट फॉर्मेट को मैच अवधि (कम से अधिक) में लगाएं:", opt: ["T10", "T20", "ODI", "टेस्ट"], correct: [0,1,2,3], expl: "10 ओवर ➔ 20 ओवर ➔ 50 ओवर ➔ 5 दिन"},
        {q: "इन राज्यों को जनसंख्या घनत्व (कम से अधिक) में लगाएं:", opt: ["अरुणाचल", "राजस्थान", "उत्तर प्रदेश", "बिहार"], correct: [0,1,2,3], expl: "अरुणाचल (17) ➔ राजस्थान ➔ UP ➔ बिहार (1106)"},
        {q: "इन वाद्य यंत्रों को तार (Strings) के आधार पर लगाएं:", opt: ["बांसुरी", "ढोलक", "सितार", "पियानो"], correct: [0,1,2,3], expl: "बांसुरी (फूँक) ➔ ढोलक (चमड़ा) ➔ सितार (तार) ➔ पियानो"},
        {q: "इन भारतीय फिल्मों को ऑस्कर नामांकन के वर्ष में लगाएं:", opt: ["मदर इंडिया", "लगान", "लंचबॉक्स", "आरआरआर"], correct: [0,1,2,3], expl: "1958 ➔ 2002 ➔ 2013 ➔ 2022"},
        {q: "इन ग्रहों को उनके व्यास (Diameter) के अनुसार छोटे से बड़े में लगाएं:", opt: ["बुध", "मंगल", "पृथ्वी", "शनि"], correct: [0,1,2,3], expl: "बुध ➔ मंगल ➔ पृथ्वी ➔ शनि"},
        {q: "इन भारतीय नदियों को लंबाई में कम से अधिक लगाएं:", opt: ["कावेरी", "नर्मदा", "यमुना", "गंगा"], correct: [0,1,2,3], expl: "800km ➔ 1312km ➔ 1376km ➔ 2525km"},
        {q: "इन मुगल इमारतों को ऊंचाई में कम से अधिक लगाएं:", opt: ["जामा मस्जिद", "हुमायूं मकबरा", "कुतुब मीनार", "ताजमहल"], correct: [0,1,2,3], expl: "ऊंचाई का ऐतिहासिक क्रम।"},
        {q: "इन महाद्वीपों को क्षेत्रफल में छोटे से बड़े लगाएं:", opt: ["ऑस्ट्रेलिया", "यूरोप", "अफ्रीका", "एशिया"], correct: [0,1,2,3], expl: "ऑस्ट्रेलिया ➔ यूरोप ➔ अफ्रीका ➔ एशिया"},
        {q: "इन राज्यों को उनकी जीडीपी (कम से अधिक) में लगाएं:", opt: ["सिक्किम", "उत्तराखंड", "पंजाब", "महाराष्ट्र"], correct: [0,1,2,3], expl: "आर्थिक स्थिति के अनुसार क्रम।"},
        {q: "इन गैसों को घनत्व (कम से अधिक) में लगाएं:", opt: ["हाइड्रोजन", "हीलियम", "नाइट्रोजन", "ऑक्सीजन"], correct: [0,1,2,3], expl: "H ➔ He ➔ N ➔ O"},
        {q: "इन घटनाओं को 20वीं सदी के क्रम में लगाएं:", opt: ["प्रथम विश्व युद्ध", "स्वतंत्रता", "आपातकाल", "आर्थिक उदारीकरण"], correct: [0,1,2,3], expl: "1914 ➔ 1947 ➔ 1975 ➔ 1991"},
        {q: "इन राज्यों को उत्तर से दक्षिण में लगाएं:", opt: ["पंजाब", "हरियाणा", "मध्य प्रदेश", "आंध्र प्रदेश"], correct: [0,1,2,3], expl: "पंजाब ➔ हरियाणा ➔ MP ➔ AP"},
        {q: "इन प्रसिद्ध व्यक्तियों को जन्म वर्ष में लगाएं:", opt: ["अंबेडकर", "नेहरू", "इंदिरा गांधी", "राजीव गांधी"], correct: [0,1,2,3], expl: "1891 ➔ 1889 ➔ 1917 ➔ 1944"},
        {q: "इन वाद्य यंत्रों को वर्णमाला में लगाएं:", opt: ["बांसुरी", "डफली", "सितार", "तबला"], correct: [0,1,2,3], expl: "B ➔ D ➔ S ➔ T"},
        {q: "इन राज्यों को तटरेखा में कम से अधिक लगाएं:", opt: ["गोवा", "ओडिशा", "तमिलनाडु", "गुजरात"], correct: [0,1,2,3], expl: "101 ➔ 480 ➔ 906 ➔ 1214"},
        {q: "इन मुगल सम्राटों को लगाएं:", opt: ["बाबर", "जहाँगीर", "शाहजहाँ", "औरंगजेब"], correct: [0,1,2,3], expl: "1526 ➔ 1605 ➔ 1628 ➔ 1658"},
        {q: "इन राज्यों को उत्तर से दक्षिण लगाएं:", opt: ["जम्मू", "हिमाचल", "उत्तराखंड", "दिल्ली"], correct: [0,1,2,3], expl: "J&K ➔ HP ➔ UK ➔ Delhi"},
        {q: "इन मिशनों को लगाएं:", opt: ["मंगलयान", "चंद्रयान-1", "चंद्रयान-2", "चंद्रयान-3"], correct: [0,1,2,3], expl: "2013 ➔ 2008 ➔ 2019 ➔ 2023"},
        {q: "इन तत्वों को लगाएं:", opt: ["सोडियम", "मैग्नीशियम", "एल्युमिनियम", "सिलिकॉन"], correct: [0,1,2,3], expl: "Na(11) ➔ Mg(12) ➔ Al(13) ➔ Si(14)"},
        {q: "इन स्टेडियमों को लगाएं:", opt: ["ईडन", "मेलबर्न", "नरेंद्र मोदी", "लॉर्ड्स"], correct: [0,1,2,3], expl: "क्षमता के आधार पर क्रम।"},
        {q: "इन राज्यों को साक्षरता में लगाएं:", opt: ["बिहार", "उत्तर प्रदेश", "दिल्ली", "केरल"], correct: [0,1,2,3], expl: "61% ➔ 67% ➔ 86% ➔ 94%"},
        {q: "इन महापुरुषों को जन्म वर्ष में लगाएं:", opt: ["विवेकानंद", "गांधी", "पटेल", "भगत सिंह"], correct: [0,1,2,3], expl: "1863 ➔ 1869 ➔ 1875 ➔ 1907"},
        {q: "इन नदियों को लंबाई में लगाएं:", opt: ["महानदी", "गोदावरी", "गंगा", "ब्रह्मपुत्र"], correct: [0,1,2,3], expl: "858 ➔ 1465 ➔ 2525 ➔ 2900"},
        {q: "इन घटनाओं को क्रम में लगाएं:", opt: ["जालियांवाला", "असहयोग", "दांडी", "भारत छोड़ो"], correct: [0,1,2,3], expl: "1919 ➔ 1920 ➔ 1930 ➔ 1942"},
        {q: "इन खेलों को खिलाड़ियों में लगाएं:", opt: ["टेनिस", "खो-खो", "वॉलीबॉल", "क्रिकेट"], correct: [0,1,2,3], expl: "1 ➔ 9 ➔ 6 ➔ 11"},
        {q: "इन शहरों को पश्चिम से पूर्व लगाएं:", opt: ["सूरत", "नागपुर", "रायपुर", "भुवनेश्वर"], correct: [0,1,2,3], expl: "गुजरात ➔ महाराष्ट्र ➔ छत्तीसगढ़ ➔ ओडिशा"},
        {q: "इन मुगल सम्राटों को लगाएं:", opt: ["अकबर", "जहाँगीर", "शाहजहाँ", "औरंगजेब"], correct: [0,1,2,3], expl: "1556 ➔ 1605 ➔ 1628 ➔ 1658"},
        {q: "इन श्रेणियों को लगाएं:", opt: ["कोशिका", "अंग", "तन्त्र", "जीव"], correct: [0,1,2,3], expl: "Cell ➔ Organ ➔ System ➔ Organism"},
        {q: "इन मिशनों को लगाएं:", opt: ["गगनयान", "चंद्रयान-3", "आदित्य L1", "मंगलयान"], correct: [0,1,2,3], expl: "भविष्य ➔ 2023 ➔ 2023 ➔ 2013"},
        {q: "इन तत्वों को लगाएं:", opt: ["हीलियम", "लिथियम", "बेरिलियम", "बोरोन"], correct: [0,1,2,3], expl: "He(2) ➔ Li(3) ➔ Be(4) ➔ B(5)"},
        {q: "इन क्रिकेट खिलाड़ियों को रन में लगाएं:", opt: ["गावस्कर", "सचिन", "कोहली", "द्रविड़"], correct: [0,1,2,3], expl: "10122 ➔ 15921 ➔ 8000+ ➔ 13288"},
        {q: "इन राज्यों को उत्तर से दक्षिण लगाएं:", opt: ["राजस्थान", "गुजरात", "महाराष्ट्र", "गोवा"], correct: [0,1,2,3], expl: "उत्तर से दक्षिण भौगोलिक क्रम।"},
        {q: "इन अभिनेताओं को डेब्यू में लगाएं:", opt: ["अमिताभ", "शाहरुख", "ऋतिक", "रणबीर"], correct: [0,1,2,3], expl: "1969 ➔ 1992 ➔ 2000 ➔ 2007"},
        {q: "इन धर्मों को भारत में आगमन/स्थापना में लगाएं:", opt: ["हिन्दू", "बौद्ध", "सिख", "इस्लाम"], correct: [0,1,2,3], expl: "प्राचीन ➔ 6ठी सदी ➔ 15वीं सदी ➔ 7वीं सदी"},
        {q: "इन संख्याओं को बढ़ते क्रम में लगाएं:", opt: ["शून्य", "सौ", "हजार", "लाख"], correct: [0,1,2,3], expl: "क्रम में।" }
    ];

    let remainingIndices = questionsPool.map((_, i) => i);
    let currentQ, userSeq = [], shuffledOptions = [], correctOrderString = "", timeLeft = 10, isRunning = false, clockInt;

    function initiateGame() {
        document.getElementById('start-btn').style.display = "none";
        document.getElementById('game-ui').style.display = "block";
        nextRound();
    }

    function nextRound() {
        if(remainingIndices.length === 0) { alert("शानदार चंदन भाई! रिफ्रेश करें।"); location.reload(); return; }
        let randomIndex = Math.floor(Math.random() * remainingIndices.length);
        let qIndex = remainingIndices.splice(randomIndex, 1)[0];
        currentQ = questionsPool[qIndex];

        shuffledOptions = currentQ.opt.map((text, index) => ({ text, originalIndex: index }))
                                      .sort(() => Math.random() - 0.5);
        
        correctOrderString = currentQ.correct.map(val => {
            return shuffledOptions.findIndex(opt => opt.originalIndex === val);
        }).map(idx => String.fromCharCode(65 + idx)).join("");

        userSeq = []; timeLeft = 10; isRunning = false;
        document.getElementById('timer').innerText = "10";
        document.getElementById('result-box').style.display = "none";
        document.getElementById('game-ui').style.opacity = "1";
        document.getElementById('options-container').style.display = "none";
        document.getElementById('controls').style.display = "none";
        document.getElementById('current-tap').innerText = "क्रम: ";
        document.getElementById('q-count').innerText = "प्रगति: " + (50 - remainingIndices.length) + "/50";
        document.getElementById('question-text').innerText = currentQ.q;
        
        let htmlBuild = "";
        shuffledOptions.forEach((o, i) => {
            let label = String.fromCharCode(65 + i);
            htmlBuild += `<button class="btn" id="btn-${label}" onclick="tapOption('${label}')">${label}: ${o.text}</button>`;
        });
        document.getElementById('options-container').innerHTML = htmlBuild;
        
        setTimeout(() => {
            document.getElementById('options-container').style.display = "grid";
            document.getElementById('controls').style.display = "flex";
            isRunning = true;
            clockInt = setInterval(() => {
                if(timeLeft > 0 && isRunning) { timeLeft--; document.getElementById('timer').innerText = timeLeft; }
                else if(timeLeft === 0 && isRunning) { endShow("समय समाप्त! ⏰"); }
            }, 1000);
        }, 5000);
    }

    function tapOption(label) {
        if(!isRunning || userSeq.includes(label) || userSeq.length >= 4) return;
        userSeq.push(label);
        document.getElementById("btn-" + label).classList.add('selected');
        document.getElementById('current-tap').innerText = "क्रम: " + userSeq.join(' ➔ ');
    }

    function resetSelection() {
        if(!isRunning) return;
        userSeq = [];
        document.getElementById('current-tap').innerText = "क्रम: ";
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('selected'));
    }

    function verifySequence() { if(userSeq.length === 4) endShow(); }

    function endShow(msg) {
        isRunning = false; clearInterval(clockInt);
        const winResult = userSeq.join("") === correctOrderString;
        document.getElementById('game-ui').style.opacity = "0.3";
        document.getElementById('result-box').style.display = "block";
        document.getElementById('res-status').innerText = msg || (winResult ? "अद्भुत! सही जवाब! ✅" : "गलत जवाब! ❌");
        document.getElementById('res-status').style.color = winResult ? "#2ecc71" : "#e74c3c";
        document.getElementById('user-ans').innerText = userSeq.join(" ➔ ");
        document.getElementById('detailed-expl').innerHTML = currentQ.expl;
    }
</script>
</body>
</html>
