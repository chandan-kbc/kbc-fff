<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: #0d0033; color: white; text-align: center; font-family: sans-serif; padding: 10px; margin: 0; }
        .container { border: 3px solid #ffd700; padding: 15px; border-radius: 20px; background: linear-gradient(180deg, #1a0066 0%, #0d0033 100%); min-height: 92vh; display: flex; flex-direction: column; justify-content: center; }
        h1 { color: #ffd700; text-shadow: 2px 2px 5px #000; font-size: 18px; margin: 5px 0; }
        .timer-val { font-size: 55px; color: #ffff00; font-weight: bold; margin: 5px 0; min-height: 65px; }
        #question-text { font-size: 18px; color: #fff; font-weight: bold; margin-bottom: 20px; line-height: 1.4; min-height: 70px; padding: 0 5px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; display: none; }
        .btn { background: #2a0099; color: white; border: 1.5px solid #ffd700; padding: 18px 5px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .selected { background: #ffd700 !important; color: #000 !important; }
        .action-area { display: none; justify-content: space-around; margin-top: 15px; width: 100%; }
        #clear-btn { background: #dc3545; color: white; padding: 12px 25px; border-radius: 8px; border: none; font-weight: bold; }
        #ok-btn { background: #28a745; color: white; padding: 12px 50px; border-radius: 8px; border: 2px solid #fff; font-weight: bold; font-size: 18px; }
        #start-btn { background: #28a745; color: white; padding: 25px; border-radius: 15px; font-size: 22px; border: none; font-weight: bold; width: 85%; margin: 80px auto; }
        #result-box { display: none; margin-top: 15px; padding: 15px; border: 2px solid #ffd700; border-radius: 15px; text-align: left; background: rgba(0,0,0,0.85); line-height: 1.5; }
        .correct-seq { color: #2ecc71; font-weight: bold; font-size: 14px; }
        .fact-box { margin-top: 10px; border-top: 1px solid #555; padding-top: 10px; color: #ddd; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h1>FASTEST FINGER FIRST</h1>
    <div id="q-count" style="color: #aaa; font-size: 12px;">सवाल: 0/50</div>
    <div class="timer-val" id="timer">10</div>
    
    <button id="start-btn" onclick="initiateGame()">खेल शुरू करें</button>

    <div id="game-ui" style="display:none;">
        <p id="question-text"></p>
        <div class="options-grid" id="options-container"></div>
        <div id="current-tap" style="margin: 10px 0; color: yellow; font-weight: bold; min-height: 25px;">क्रम: </div>
        <div class="action-area" id="controls">
            <button id="clear-btn" onclick="resetSelection()">Clear</button>
            <button id="ok-btn" onclick="verifySequence()">OK</button>
        </div>
    </div>

    <div id="result-box">
        <h3 id="res-status" style="text-align:center;"></h3>
        <p><b>आपका उत्तर:</b> <span id="user-ans"></span></p>
        <div id="detailed-expl" class="fact-box"></div>
        <button class="btn" onclick="nextRound()" style="background:#fff; color:#000; margin: 15px auto; width: 100%;">अगला प्रश्न (Next)</button>
    </div>
</div>

<script>
    const questionsPool = [
        { q: "इन बॉलीवुड फिल्मों को रिलीज वर्ष के अनुसार पहले से बाद के क्रम में लगाएं:", opt: [{id:'A',t:"मदर इंडिया"},{id:'B',t:"शोले"},{id:'C',t:"लगान"},{id:'D',t:"दंगल"}], ans: "ABCD", expl: "मदर इंडिया (1957) ➔ शोले (1975) ➔ लगान (2001) ➔ दंगल (2016)" },
        { q: "इन त्योहारों को हिंदू कैलेंडर के अनुसार साल के शुरू से अंत के क्रम में लगाएं:", opt: [{id:'A',t:"होली"},{id:'B',t:"रामनवमी"},{id:'C',t:"रक्षाबंधन"},{id:'D',t:"दीपावली"}], ans: "ABCD", expl: "होली ➔ रामनवमी ➔ रक्षाबंधन ➔ दीपावली" },
        { q: "इन ऐतिहासिक शासकों को उनके कालक्रम के अनुसार पहले से बाद में लगाएं:", opt: [{id:'A',t:"अजातशत्रु"},{id:'B',t:"अशोक"},{id:'C',t:"अकबर"},{id:'D',t:"शिवाजी महाराज"}], ans: "ABCD", expl: "अजातशत्रु (मगध) ➔ अशोक (मौर्य) ➔ अकबर (मुगल) ➔ शिवाजी (मराठा)" },
        { q: "इन संख्याओं को उनके बढ़ते क्रम (Smallest to Largest) में लगाएं:", opt: [{id:'A',t:"सवा दो"},{id:'B',t:"ढाई"},{id:'C',  t:"पौने तीन"},{id:'D',t:"तीन"}], ans: "ABCD", expl: "सवा दो (2.25) ➔ ढाई (2.50) ➔ पौने तीन (2.75) ➔ तीन (3.00)" },
        { q: "भारत के इन उपग्रहों को उनके लॉन्च के वर्ष के अनुसार क्रम में लगाएं:", opt: [{id:'A',t:"आर्यभट्ट"},{id:'B',t:"भास्कर-1"},{id:'C',t:"रोहिणी"},{id:'D',t:"मंगलयान"}], ans: "ABCD", expl: "आर्यभट्ट (1975) ➔ भास्कर (1979) ➔ रोहिणी (1980) ➔ मंगलयान (2013)" },
        { q: "इन शहरों को उत्तर से दक्षिण (North to South) के क्रम में लगाएं:", opt: [{id:'A',t:"श्रीनगर"},{id:'B',t:"दिल्ली"},{id:'C',t:"बेंगलुरु"},{id:'D',t:"कन्याकुमारी"}], ans: "ABCD", expl: "श्रीनगर ➔ दिल्ली ➔ बेंगलुरु ➔ कन्याकुमारी" },
        { q: "इन नदियों को उनकी लंबाई के अनुसार अधिक से कम के क्रम में लगाएं:", opt: [{id:'A',t:"गंगा"},{id:'B',t:"गोदावरी"},{id:'C',t:"नर्मदा"},{id:'D',t:"यमुना"}], ans: "ABCD", expl: "गंगा ➔ गोदावरी ➔ नर्मदा ➔ यमुना" },
        { q: "इन क्रिकेट वर्ल्ड कप जीत के वर्षों को पहले से बाद के क्रम में लगाएं:", opt: [{id:'A',t:"वेस्टइंडीज 1st"},{id:'B',t:"भारत 1st"},{id:'C',t:"ऑस्ट्रेलिया 1st"},{id:'D',t:"इंग्लैंड 1st"}], ans: "ABCD", expl: "वेस्टइंडीज (1975) ➔ भारत (1983) ➔ ऑस्ट्रेलिया (1987) ➔ इंग्लैंड (2019)" },
        { q: "इन ऊंचाइयों को कम से अधिक (Small to Large) के क्रम में लगाएं:", opt: [{id:'A',t:"चारमीनार"},{id:'B',t:"कुतुब मीनार"},{id:'C',t:"स्टैच्यू ऑफ यूनिटी"},{id:'D',t:"बुर्ज खलीफा"}], ans: "ABCD", expl: "चारमीनार (56m) ➔ कुतुब मीनार (73m) ➔ स्टैच्यू (182m) ➔ बुर्ज खलीफा (828m)" },
        { q: "इन महापुरुषों को जन्म वर्ष के अनुसार पहले से बाद में लगाएं:", opt: [{id:'A',t:"राजा राममोहन राय"},{id:'B',t:"स्वामी विवेकानंद"},{id:'C',t:"गांधीजी"},{id:'D',t:"भगत सिंह"}], ans: "ACBD", expl: "राममोहन राय (1772) ➔ गांधीजी (1869) ➔ विवेकानंद (1863) ➔ भगत सिंह (1907)" },
        { q: "इन ग्रहों को सूर्य से बढ़ती दूरी के अनुसार लगाएं:", opt: [{id:'A',t:"बुध"},{id:'B',t:"शुक्र"},{id:'C',t:"पृथ्वी"},{id:'D',t:"मंगल"}], ans: "ABCD", expl: "बुध ➔ शुक्र ➔ पृथ्वी ➔ मंगल" },
        { q: "इन मोबाइल कंपनियों को स्थापना वर्ष के अनुसार पहले से बाद में लगाएं:", opt: [{id:'A',t:"नोकिया"},{id:'B',t:"सैमसंग"},{id:'C',t:"एप्पल"},{id:'D',t:"शाओमी"}], ans: "ABCD", expl: "नोकिया (1865) ➔ सैमसंग (1938) ➔ एप्पल (1976) ➔ शाओमी (2010)" },
        { q: "रामायण के इन कांडों को सही क्रम में लगाएं:", opt: [{id:'A',t:"बाल कांड"},{id:'B',t:"अयोध्या कांड"},{id:'C',t:"अरण्य कांड"},{id:'D',t:"सुंदर कांड"}], ans: "ABCD", expl: "बाल ➔ अयोध्या ➔ अरण्य ➔ सुंदर" },
        { q: "इन हिंदी साहित्यकारों को जन्म वर्ष के अनुसार क्रम में लगाएं:", opt: [{id:'A',t:"कबीरदास"},{id:'B',t:"तुलसीदास"},{id:'C',t:"प्रेमचंद"},{id:'D',t:"हरिवंश राय बच्चन"}], ans: "ABCD", expl: "कबीर (15वीं सदी) ➔ तुलसी (16वीं सदी) ➔ प्रेमचंद (1880) ➔ बच्चन (1907)" },
        { q: "इन भारतीय राज्यों को क्षेत्रफल के अनुसार बड़े से छोटे क्रम में लगाएं:", opt: [{id:'A',t:"राजस्थान"},{id:'B',t:"मध्य प्रदेश"},{id:'C',t:"महाराष्ट्र"},{id:'D',t:"उत्तर प्रदेश"}], ans: "ABCD", expl: "राजस्थान ➔ MP ➔ महाराष्ट्र ➔ UP" },
        { q: "इन कंप्यूटर स्टोरेज इकाइयों को कम से अधिक में लगाएं:", opt: [{id:'A',t:"KB"},{id:'B',t:"MB"},{id:'C',t:"GB"},{id:'D',t:"TB"}], ans: "ABCD", expl: "KB ➔ MB ➔ GB ➔ TB" },
        { q: "इन भाषाओं को भारत में बोलने वालों की संख्या (अधिक से कम) में लगाएं:", opt: [{id:'A',t:"हिंदी"},{id:'B',t:"बंगाली"},{id:'C',t:"मराठी"},{id:'D',t:"तेलुगु"}], ans: "ABCD", expl: "हिंदी ➔ बंगाली ➔ मराठी ➔ तेलुगु" },
        { q: "इन जीवों को जीवन अवधि (Life Span) के अनुसार कम से अधिक में लगाएं:", opt: [{id:'A',t:"मच्छर"},{id:'B',t:"कुत्ता"},{id:'C',t:"हाथी"},{id:'D',t:"कछुआ"}], ans: "ABCD", expl: "मच्छर ➔ कुत्ता ➔ हाथी ➔ कछुआ" },
        { q: "इन बॉलीवुड अभिनेताओं को डेब्यू के अनुसार पहले से बाद में लगाएं:", opt: [{id:'A',t:"अजय देवगन"},{id:'B',t:"शाहरुख खान"},{id:'C',t:"ऋतिक रोशन"},{id:'D',t:"रणबीर कपूर"}], ans: "ABCD", expl: "अजय (1991) ➔ शाहरुख (1992) ➔ ऋतिक (2000) ➔ रणबीर (2007)" },
        { q: "इन सिखों के गुरुओं को उनके क्रम के अनुसार लगाएं:", opt: [{id:'A',t:"गुरु नानक"},{id:'B',t:"गुरु अंगद"},{id:'C',t:"गुरु अमर दास"},{id:'D',t:"गुरु राम दास"}], ans: "ABCD", expl: "ये प्रथम चार सिख गुरु हैं।" },
        { q: "इन भारतीय करेंसी नोटों को मूल्य के अनुसार बढ़ते क्रम में लगाएं:", opt: [{id:'A',t:"₹10"},{id:'B',t:"₹50"},{id:'C',t:"₹200"},{id:'D',t:"₹500"}], ans: "ABCD", expl: "₹10 ➔ ₹50 ➔ ₹200 ➔ ₹500" },
        { q: "इन ऐतिहासिक स्मारकों को उनके निर्माण के अनुसार पुराने से नए क्रम में लगाएं:", opt: [{id:'A',t:"सांची स्तूप"},{id:'B',t:"कुतुब मीनार"},{id:'C',t:"ताजमहल"},{id:'D',t:"इंडिया गेट"}], ans: "ABCD", expl: "सांची ➔ कुतुब ➔ ताजमहल ➔ इंडिया गेट" },
        { q: "इंद्रधनुष के इन रंगों को VIBGYOR क्रम में नीचे से ऊपर लगाएं:", opt: [{id:'A',t:"बैंगनी"},{id:'B',t:"नीला"},{id:'C',t:"हरा"},{id:'D',t:"लाल"}], ans: "ABCD", expl: "Violet ➔ Blue ➔ Green ➔ Red" },
        { q: "इन क्रिकेट खिलाड़ियों को टेस्ट रनों के अनुसार अधिक से कम में लगाएं:", opt: [{id:'A',t:"सचिन तेंदुलकर"},{id:'B',t:"राहुल द्रविड़"},{id:'C',t:"सुनील गावस्कर"},{id:'D',t:"विराट कोहली"}], ans: "ABCD", expl: "सचिन ➔ द्रविड़ ➔ गावस्कर ➔ कोहली" },
        { q: "इन भारतीय राज्यों को उनकी साक्षरता दर (अधिक से कम) में लगाएं:", opt: [{id:'A',t:"केरल"},{id:'B',t:"मिजोरम"},{id:'C',t:"गोवा"},{id:'D',t:"बिहार"}], ans: "ABCD", expl: "केरल ➔ मिजोरम ➔ गोवा ➔ बिहार" },
        { q: "इन ग्रहों को उनके चंद्रमाओं की संख्या के अनुसार बढ़ते क्रम में लगाएं:", opt: [{id:'A',t:"बुध"},{id:'B',t:"पृथ्वी"},{id:'C',t:"मंगल"},{id:'D',t:"बृहस्पति"}], ans: "ABCD", expl: "बुध (0) ➔ पृथ्वी (1) ➔ मंगल (2) ➔ बृहस्पति (95)" },
        { q: "इन महत्वपूर्ण घटनाओं को पहले से बाद के क्रम में लगाएं:", opt: [{id:'A',t:"प्रथम विश्व युद्ध"},{id:'B',t:"द्वितीय विश्व युद्ध"},{id:'C',t:"भारत की आज़ादी"},{id:'D',t:"चंद्रयान-1"}], ans: "ABCD", expl: "1914 ➔ 1939 ➔ 1947 ➔ 2008" },
        { q: "इन बॉलीवुड अभिनेत्रियों को डेब्यू वर्ष के अनुसार लगाएं:", opt: [{id:'A',t:"काजोल"},{id:'B',t:"करिश्मा कपूर"},{id:'C',t:"प्रियंका चोपड़ा"},{id:'D',t:"आलिया भट्ट"}], ans: "BADC", expl: "करिश्मा (1991) ➔ काजोल (1992) ➔ प्रियंका (2002) ➔ आलिया (2012)" },
        { q: "भारत के इन राष्ट्रपतियों को कार्यकाल के अनुसार क्रम में लगाएं:", opt: [{id:'A',t:"राजेंद्र प्रसाद"},{id:'B',t:"डॉ राधाकृष्णन"},{id:'C',t:"एपीजे अब्दुल कलाम"},{id:'D',t:"द्रौपदी मुर्मू"}], ans: "ABCD", expl: "राजेंद्र प्रसाद ➔ राधाकृष्णन ➔ कलाम ➔ मुर्मू" },
        { q: "इन खेलों को खिलाड़ियों की संख्या के अनुसार बढ़ते क्रम में लगाएं:", opt: [{id:'A',t:"टेनिस (Single)"},{id:'B',t:"बास्केटबॉल"},{id:'C',t:"खो-खो"},{id:'D',t:"क्रिकेट"}], ans: "ABCD", expl: "1 ➔ 5 ➔ 9 ➔ 11" },
        { q: "महाभारत के इन पात्रों को आयु के अनुसार बड़े से छोटे क्रम में लगाएं:", opt: [{id:'A',t:"भीष्म"},{id:'B',t:"धृतराष्ट्र"},{id:'C',t:"युधिष्ठिर"},{id:'D',t:"अभिमन्यु"}], ans: "ABCD", expl: "भीष्म ➔ धृतराष्ट्र ➔ युधिष्ठिर ➔ अभिमन्यु" },
        { q: "इन वैज्ञानिक खोजों को पहले से बाद के क्रम में लगाएं:", opt: [{id:'A',t:"पहिया"},{id:'B',t:"बिजली का बल्ब"},{id:'C',t:"पेनिसिलिन"},{id:'D',t:"इंटरनेट"}], ans: "ABCD", expl: "पहिया ➔ बल्ब ➔ पेनिसिलिन ➔ इंटरनेट" },
        { q: "इन भारतीय शहरों को पश्चिम से पूर्व (West to East) में लगाएं:", opt: [{id:'A',t:"अहमदाबाद"},{id:'B',t:"भोपाल"},{id:'C',t:"वाराणसी"},{id:'D',t:"कोलकाता"}], ans: "ABCD", expl: "अहमदाबाद ➔ भोपाल ➔ वाराणसी ➔ कोलकाता" },
        { q: "इन नोबेल विजेताओं को वर्ष के अनुसार सजाएं:", opt: [{id:'A',t:"सी.वी. रमन"},{id:'B',t:"मदर टेरेसा"},{id:'C',t:"अमर्त्य सेन"},{id:'D',t:"अभिजीत बनर्जी"}], ans: "ABCD", expl: "1930 ➔ 1979 ➔ 1998 ➔ 2019" },
        { q: "इन मोबाइल संचार पीढ़ियों (G) को पुराने से नए क्रम में लगाएं:", opt: [{id:'A',t:"2G"},{id:'B',t:"3G"},{id:'C',t:"4G"},{id:'D',t:"5G"}], ans: "ABCD", expl: "2G ➔ 3G ➔ 4G ➔ 5G" },
        { q: "इन मुगल सम्राटों को शासन काल के अनुसार पहले से बाद में लगाएं:", opt: [{id:'A',t:"बाबर"},{id:'B',t:"हुमायूँ"},{id:'C',t:"अकबर"},{id:'D',t:"जहाँगीर"}], ans: "ABCD", expl: "बाबर ➔ हुमायूँ ➔ अकबर ➔ जहाँगीर" },
        { q: "इन वाद्य यंत्रों को वर्णमाला (A-Z) के अनुसार लगाएं:", opt: [{id:'A',t:"ढोलक"},{id:'B',t:"सितार"},{id:'C',t:"तबला"},{id:'D',t:"बांसुरी"}], ans: "DACB", expl: "बांसुरी ➔ ढोलक ➔ सितार ➔ तबला" },
        { q: "इन जीव विज्ञान श्रेणियों को छोटे से बड़े क्रम में लगाएं:", opt: [{id:'A',t:"कोशिका (Cell)"},{id:'B',t:"ऊतक (Tissue)"},{id:'C',t:"अंग (Organ)"},{id:'D',t:"शरीर (Body)"}], ans: "ABCD", expl: "कोशिका ➔ ऊतक ➔ अंग ➔ शरीर" },
        { q: "इन पर्वत श्रृंखलाओं को लंबाई के अनुसार अधिक से कम में लगाएं:", opt: [{id:'A',t:"एंडीज"},{id:'B',t:"रॉकीज"},{id:'C',t:"हिमालय"},{id:'D',t:"आल्प्स"}], ans: "ABCD", expl: "एंडीज सबसे लंबी पर्वत श्रृंखला है।" },
        { q: "इन भारतीय राज्यों को उत्तर से दक्षिण के क्रम में लगाएं:", opt: [{id:'A',t:"हिमाचल"},{id:'B',t:"उत्तर प्रदेश"},{id:'C',t:"मध्य प्रदेश"},{id:'D',t:"महाराष्ट्र"}], ans: "ABCD", expl: "हिमाचल ➔ UP ➔ MP ➔ महाराष्ट्र" },
        { q: "इन अंतरिक्ष मिशनों को वर्ष के अनुसार क्रम में लगाएं:", opt: [{id:'A',t:"अपोलो 11"},{id:'B',t:"वायेजर 1"},{id:'C',t:"मार्स पाथफाइंडर"},{id:'D',t:"जेम्स वेब टेलीस्कोप"}], ans: "ABCD", expl: "1969 ➔ 1977 ➔ 1997 ➔ 2021" },
        { q: "इन तत्वों को परमाणु क्रमांक (Atomic No) के बढ़ते क्रम में लगाएं:", opt: [{id:'A',t:"हाइड्रोजन"},{id:'B',t:"हीलियम"},{id:'C',t:"लिथियम"},{id:'D',t:"बेरिलियम"}], ans: "ABCD", expl: "H(1) ➔ He(2) ➔ Li(3) ➔ Be(4)" },
        { q: "इन क्रिकेट स्टेडियमों को उनकी दर्शक क्षमता (बड़े से छोटे) में लगाएं:", opt: [{id:'A',t:"नरेंद्र मोदी स्टेडियम"},{id:'B',t:"मेलबर्न (MCG)"},{id:'C',t:"ईडन गार्डन्स"},{id:'D',t:"लॉर्ड्स"}], ans: "ABCD", expl: "मोदी स्टेडियम ➔ MCG ➔ ईडन ➔ लॉर्ड्स" },
        { q: "इन ऊंचाइयों को बढ़ते क्रम में लगाएं:", opt: [{id:'A',t:"पेड़"},{id:'B',t:"पहाड़ी"},{id:'C',t:"पर्वत"},{id:'D',t:"एवरेस्ट"}], ans: "ABCD", expl: "पेड़ ➔ पहाड़ी ➔ पर्वत ➔ एवरेस्ट" },
        { q: "इन ग्रहों को उनके आकार (बड़े से छोटे) के अनुसार लगाएं:", opt: [{id:'A',t:"बृहस्पति"},{id:'B',t:"शनि"},{id:'C',t:"पृथ्वी"},{id:'D',t:"मंगल"}], ans: "ABCD", expl: "बृहस्पति ➔ शनि ➔ पृथ्वी ➔ मंगल" },
        { q: "इन विटामिनों को वर्णमाला क्रम में लगाएं:", opt: [{id:'A',t:"विटामिन A"},{id:'B',t:"विटामिन B"},{id:'C',t:"विटामिन C"},{id:'D',t:"विटामिन D"}], ans: "ABCD", expl: "A ➔ B ➔ C ➔ D" },
        { q: "इन सोशल मीडिया एप्स को लॉन्च वर्ष के अनुसार क्रम में लगाएं:", opt: [{id:'A',t:"फेसबुक"},{id:'B',t:"यूट्यूब"},{id:'C',t:"व्हाट्सएप"},{id:'D',t:"इंस्टाग्राम"}], ans: "ABCD", expl: "2004 ➔ 2005 ➔ 2009 ➔ 2010" },
        { q: "इन भारतीय राज्यों को जनसंख्या (अधिक से कम) के अनुसार लगाएं:", opt: [{id:'A',t:"उत्तर प्रदेश"},{id:'B',t:"महाराष्ट्र"},{id:'C',t:"बिहार"},{id:'D',t:"पश्चिम बंगाल"}], ans: "ABCD", expl: "UP ➔ महाराष्ट्र ➔ बिहार ➔ WB" },
        { q: "इन महासागरों को क्षेत्रफल के अनुसार बड़े से छोटे क्रम में लगाएं:", opt: [{id:'A',t:"प्रशांत"},{id:'B',t:"अटलांटिक"},{id:'C',t:"हिंद"},{id:'D',t:"आर्कटिक"}], ans: "ABCD", expl: "प्रशांत ➔ अटलांटिक ➔ हिंद ➔ आर्कटिक" },
        { q: "इन संख्याओं को बढ़ते क्रम में लगाएं:", opt: [{id:'A',t:"शून्य"},{id:'B',t:"सौ"},{id:'C',t:"हजार"},{id:'D',t:"लाख"}], ans: "ABCD", expl: "0 ➔ 100 ➔ 1000 ➔ 100000" }
    ];

    let remainingIndices = questionsPool.map((_, i) => i);
    let currentQ, userSeq = "", userNames = [], timeLeft = 10, isRunning = false, clockInt;

    function initiateGame() {
        document.getElementById('start-btn').style.display = "none";
        document.getElementById('game-ui').style.display = "block";
        nextRound();
    }

    function nextRound() {
        if(remainingIndices.length === 0) {
            alert("बधाई हो चंदन भाई! आपने सभी 50 प्रश्न पूरे किए। पेज रिफ्रेश हो रहा है।");
            location.reload();
            return;
        }

        let randomIndex = Math.floor(Math.random() * remainingIndices.length);
        let qIndex = remainingIndices.splice(randomIndex, 1)[0];
        currentQ = questionsPool[qIndex];

        userSeq = ""; userNames = []; timeLeft = 10; isRunning = false;
        document.getElementById('timer').innerText = "10";
        document.getElementById('result-box').style.display = "none";
        document.getElementById('game-ui').style.opacity = "1";
        document.getElementById('options-container').style.display = "none";
        document.getElementById('controls').style.display = "none";
        document.getElementById('current-tap').innerText = "क्रम: ";
        document.getElementById('q-count').innerText = "प्रगति: " + (50 - remainingIndices.length) + "/50";
        document.getElementById('question-text').innerText = currentQ.q;
        
        let htmlBuild = "";
        currentQ.opt.forEach(o => {
            htmlBuild += `<button class="btn" id="${o.id}" onclick="tapOption('${o.id}', '${o.t}')">${o.id}: ${o.t}</button>`;
        });
        document.getElementById('options-container').innerHTML = htmlBuild;
        
        setTimeout(() => {
            document.getElementById('options-container').style.display = "grid";
            document.getElementById('controls').style.display = "flex";
            isRunning = true;
            timerBegin();
        }, 5000);
    }

    function timerBegin() {
        clockInt = setInterval(() => {
            if(timeLeft > 0 && isRunning) {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
            } else if(timeLeft === 0 && isRunning) {
                endShow("समय समाप्त! ⏰");
            }
        }, 1000);
    }

    function tapOption(id, name) {
        if(!isRunning || userSeq.includes(id) || userSeq.length >= 4) return;
        userSeq += id;
        userNames.push(name);
        document.getElementById(id).classList.add('selected');
        document.getElementById('current-tap').innerText = "क्रम: " + userSeq.split('').join(' ➔ ');
    }

    function resetSelection() {
        if(!isRunning) return;
        userSeq = ""; userNames = [];
        document.getElementById('current-tap').innerText = "क्रम: ";
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('selected'));
    }

    function verifySequence() {
        if(!isRunning || userSeq.length < 4) return;
        endShow();
    }

    function endShow(msg) {
        isRunning = false;
        clearInterval(clockInt);
        const winResult = userSeq.replace(/\s/g,'') === currentQ.ans.replace(/\s/g,'');
        
        document.getElementById('game-ui').style.opacity = "0.3";
        document.getElementById('result-box').style.display = "block";
        document.getElementById('res-status').innerText = msg || (winResult ? "अद्भुत! सही जवाब! ✅" : "गलत जवाब! ❌");
        document.getElementById('res-status').style.color = winResult ? "#2ecc71" : "#e74c3c";
        document.getElementById('user-ans').innerText = userNames.join(" ➔ ") || "अधूरा";
        document.getElementById('detailed-expl').innerHTML = currentQ.expl;
    }
</script>
