!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBC FFF - Chandann Kumarr Edition</title>
    <style>
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a0066 0%, #0d0033 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10000;
        }
        .logo-circle {
            width: 150px; height: 150px; border: 5px solid #ffd700; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: #ffd700; font-size: 24px; font-weight: bold; text-align: center; margin-bottom: 25px;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4); line-height: 1.2;
        }
        .presenter-text { color: #ffd700; font-size: 16px; letter-spacing: 2px; margin-bottom: 35px; font-weight: bold; text-transform: uppercase; }
        .play-btn { background-color: #28a745; color: white; padding: 15px 70px; border-radius: 50px; font-size: 22px; font-weight: bold; border: 2px solid #fff; cursor: pointer; }

        body { background-color: #0d0033; color: white; text-align: center; font-family: sans-serif; padding: 10px; margin: 0; overflow-x: hidden; }
        .container { 
            border: 3px solid #ffd700; padding: 15px; border-radius: 20px; 
            background: linear-gradient(180deg, #1a0066 0%, #0d0033 100%); 
            min-height: 94vh; display: none; flex-direction: column; justify-content: center; 
            position: relative;
        }
        h1 { color: #ffd700; text-shadow: 2px 2px 5px #000; font-size: 18px; margin: 5px 0; }
        .timer-val { font-size: 65px; color: #ffff00; font-weight: bold; margin: 5px 0; min-height: 75px; }
        #question-text { font-size: 20px; color: #fff; font-weight: bold; margin-bottom: 25px; line-height: 1.4; min-height: 80px; padding: 0 10px; }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; visibility: hidden; }
        .btn { background: #2a0099; color: white; border: 1.5px solid #ffd700; padding: 22px 5px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .selected { background: #ffd700 !important; color: #000 !important; }
        
        .action-area { display: flex; justify-content: space-around; margin-top: 15px; width: 100%; visibility: hidden; }
        #clear-btn { background: #dc3545; color: white; padding: 12px 30px; border-radius: 10px; border: none; font-weight: bold; }
        #ok-btn { background: #28a745; color: white; padding: 12px 60px; border-radius: 10px; border: 2px solid #fff; font-weight: bold; font-size: 18px; }
        
        #result-box { display: none; margin-top: 15px; padding: 20px; border: 2px solid #ffd700; border-radius: 15px; text-align: left; background: rgba(0,0,0,0.95); line-height: 1.6; z-index: 100; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; }
        #detailed-expl { font-size: 14px; color: #ddd; margin-top: 10px; border-top: 1px solid #555; padding-top: 10px; }
    </style>
</head>
<body>

<div id="splash-screen">
    <div class="logo-circle">KBC<br>FFF</div>
    <div class="presenter-text">CHANDANN KUMARR PRESENTS</div>
    <button class="play-btn" onclick="startApp()">खेल शुरू करें</button>
</div>

<div class="container" id="main-container">
    <h1>FASTEST FINGER FIRST</h1>
    <div id="q-progress" style="color: #aaa; font-size: 12px;">प्रगति: 1/50</div>
    <div class="timer-val" id="timer">10</div>
    
    <div id="game-zone">
        <p id="question-text">प्रश्न लोड हो रहा है...</p>
        <div class="options-grid" id="options-container"></div>
        <div id="current-tap" style="margin: 10px 0; color: yellow; font-weight: bold; min-height: 25px;">क्रम: </div>
        <div class="action-area" id="controls">
            <button id="clear-btn" onclick="reset()">Clear</button>
            <button id="ok-btn" onclick="submit()">OK</button>
        </div>
    </div>

    <div id="result-box">
        <h3 id="res-status" style="text-align:center;"></h3>
        <div id="detailed-expl"></div>
        <button class="btn" onclick="nextRound()" style="background:#fff; color:#000; width: 100%; margin-top: 15px;">अगला प्रश्न</button>
    </div>
</div>

<script>
    const questions = [
        { q: "इन भारतीय राज्यों को उनकी तटरेखा (Coastline) की लंबाई के अनुसार बड़े से छोटे क्रम में लगाएं:", opt: [{id:'A',t:"गुजरात"},{id:'B',t:"आंध्र प्रदेश"},{id:'C',t:"तमिलनाडु"},{id:'D',t:"महाराष्ट्र"}], ans: "ABCD", expl: "गुजरात ➔ आंध्र प्रदेश ➔ तमिलनाडु ➔ महाराष्ट्र" },
        { q: "इन बॉलीवुड अभिनेताओं को उनकी उम्र के अनुसार बड़े से छोटे क्रम में लगाएं:", opt: [{id:'A',t:"अमिताभ बच्चन"},{id:'B',t:"शाहरुख खान"},{id:'C',t:"ऋतिक रोशन"},{id:'D',t:"रणबीर कपूर"}], ans: "ABCD", expl: "अमिताभ ➔ शाहरुख ➔ ऋतिक ➔ रणबीर" },
        { q: "महाभारत के इन योद्धाओं को उनके वध के क्रम में लगाएं (युद्ध के पहले दिन से अंत तक):", opt: [{id:'A',t:"भीष्म"},{id:'B',t:"अभिमन्यु"},{id:'C',t:"जयद्रथ"},{id:'D',t:"कर्ण"}], ans: "ABCD", expl: "भीष्म ➔ अभिमन्यु ➔ जयद्रथ ➔ कर्ण" },
        { q: "इन मोबाइल ऑपरेटिंग सिस्टम को उनके लॉन्च वर्ष के अनुसार पहले से बाद के क्रम में लगाएं:", opt: [{id:'A',t:"सिम्बियन"},{id:'B',t:"iOS"},{id:'C',t:"एंड्रॉइड"},{id:'D',t:"विंडोज"}], ans: "ABCD", expl: "सिम्बियन ➔ iOS ➔ एंड्रॉइड ➔ विंडोज" },
        { q: "इन पर्वत चोटियों को उनकी ऊंचाई के बढ़ते क्रम में लगाएं:", opt: [{id:'A',t:"नंदा देवी"},{id:'B',t:"कंचनजंघा"},{id:'C',t:"K2"},{id:'D',t:"एवरेस्ट"}], ans: "ABCD", expl: "नंदा देवी ➔ कंचनजंघा ➔ K2 ➔ एवरेस्ट" },
        { q: "इन भारतीय नोटों को उन पर छपे चित्रों के अनुसार लगाएं (₹10 से ₹200):", opt: [{id:'A',t:"कोणार्क मंदिर"},{id:'B',t:"हम्पी"},{id:'C',t:"रानी की वाव"},{id:'D',t:"सांची स्तूप"}], ans: "ABCD", expl: "₹10 ➔ ₹50 ➔ ₹100 ➔ ₹200" },
        { q: "रामायण की इन घटनाओं को क्रम से लगाएं:", opt: [{id:'A',t:"ताड़का वध"},{id:'B',t:"अहिल्या उद्धार"},{id:'C',t:"धनुष भंग"},{id:'D',t:"परशुराम मिलन"}], ans: "ABCD", expl: "ताड़का वध ➔ अहिल्या उद्धार ➔ धनुष भंग ➔ परशुराम मिलन" },
        { q: "इन क्रिकेट खिलाड़ियों को उनके टेस्ट डेब्यू वर्ष के अनुसार पहले से बाद में लगाएं:", opt: [{id:'A',t:"गावस्कर"},{id:'B',t:"अजहर"},{id:'C',t:"सचिन"},{id:'D',t:"गांगुली"}], ans: "ABCD", expl: "गावस्कर ➔ अजहर ➔ सचिन ➔ गांगुली" },
        { q: "इन ग्रहों को सूर्य से बढ़ती दूरी के अनुसार लगाएं:", opt: [{id:'A',t:"मंगल"},{id:'B',t:"बृहस्पति"},{id:'C',t:"शनि"},{id:'D',t:"अरुण"}], ans: "ABCD", expl: "मंगल ➔ बृहस्पति ➔ शनि ➔ अरुण" },
        { q: "इन मुगल शासकों को उनके शासन काल के अनुसार पहले से बाद में लगाएं:", opt: [{id:'A',t:"हुमायूं"},{id:'B',t:"जहाँगीर"},{id:'C',t:"शाहजहाँ"},{id:'D',t:"औरंगजेब"}], ans: "ABCD", expl: "हुमायूं ➔ जहाँगीर ➔ शाहजहाँ ➔ औरंगजेब" }
    ];

    for(let i=11; i<=50; i++) {
        questions.push({
            q: "सवाल " + i + ": इन संख्याओं को बढ़ते क्रम में लगाएं:",
            opt: [{id:'A',t:"सवा दो"},{id:'B',t:"साढ़े दो"},{id:'C',t:"दो"},{id:'D',t:"पौने दो"}],
            ans: "DCAB",
            expl: "<b>सही क्रम:</b> 1.75 ➔ 2 ➔ 2.25 ➔ 2.5"
        });
    }

    let pool = [...Array(questions.length).keys()];
    let played = 0, currentQ, seq = "", tVal = 10, run = false, timer;

    function startApp() {
        document.getElementById('splash-screen').style.display = 'none';
        document.getElementById('main-container').style.display = 'flex';
        nextRound();
    }

    function nextRound() {
        if(pool.length === 0) { alert("विजेता!"); location.reload(); return; }
        played++;
        let r = Math.floor(Math.random() * pool.length);
        currentQ = questions[pool.splice(r, 1)[0]];
        seq = ""; tVal = 10; run = false;
        document.getElementById('timer').innerText = "10";
        document.getElementById('result-box').style.display = "none";
        document.getElementById('options-container').style.visibility = "hidden";
        document.getElementById('controls').style.visibility = "hidden";
        document.getElementById('current-tap').innerText = "क्रम: ";
        document.getElementById('q-progress').innerText = "प्रगति: " + played + "/50";
        document.getElementById('question-text').innerText = currentQ.q;
        let h = "";
        currentQ.opt.forEach(o => { h += `<button class="btn" id="${o.id}" onclick="tap('${o.id}')">${o.id}: ${o.t}</button>`; });
        document.getElementById('options-container').innerHTML = h;
        setTimeout(() => {
            document.getElementById('options-container').style.visibility = "visible";
            document.getElementById('controls').style.visibility = "visible";
            run = true;
            clockTimer();
        }, 5000);
    }

    function clockTimer() {
        timer = setInterval(() => {
            if(tVal > 0 && run) { tVal--; document.getElementById('timer').innerText = tVal; }
            else if(tVal === 0 && run) { finish("समय समाप्त! ⏰"); }
        }, 1000);
    }

    function tap(id) {
        if(!run || seq.includes(id) || seq.length >= 4) return;
        seq += id;
        document.getElementById(id).classList.add('selected');
        document.getElementById('current-tap').innerText = "क्रम: " + seq.split('').join(' ➔ ');
    }

    function reset() {
        seq = "";
        document.getElementById('current-tap').innerText = "क्रम: ";
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('selected'));
    }

    function submit() { if(seq.length === 4) finish(); }

    function finish(msg) {
        run = false; clearInterval(timer);
        const win = seq === currentQ.ans;
        document.getElementById('result-box').style.display = "block";
        document.getElementById('res-status').innerText = msg || (win ? "अद्भुत! सही जवाब! ✅" : "गलत जवाब! ❌");
        document.getElementById('res-status').style.color = win ? "#2ecc71" : "#e74c3c";
        document.getElementById('detailed-expl').innerHTML = `<b>सही उत्तर:</b> ${currentQ.expl}`;
    }
</script>
</body>
</html
