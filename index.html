<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background-color: #0d0033; color: white; text-align: center; font-family: sans-serif; padding: 10px; margin: 0; }
        .container { border: 3px solid #ffd700; padding: 15px; border-radius: 20px; background: linear-gradient(180deg, #1a0066 0%, #0d0033 100%); min-height: 92vh; display: flex; flex-direction: column; justify-content: center; }
        h1 { color: #ffd700; text-shadow: 2px 2px 5px #000; font-size: 18px; margin: 5px 0; }
        .timer-val { font-size: 55px; color: #ffff00; font-weight: bold; margin: 5px 0; min-height: 65px; }
        #question-text { font-size: 18px; color: #fff; font-weight: bold; margin-bottom: 20px; line-height: 1.4; min-height: 70px; padding: 0 5px; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; display: none; }
        .btn { background: #2a0099; color: white; border: 1.5px solid #ffd700; padding: 18px 5px; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .selected { background: #ffd700 !important; color: #000 !important; }
        .action-area { display: none; justify-content: space-around; margin-top: 15px; width: 100%; }
        #clear-btn { background: #dc3545; color: white; padding: 12px 25px; border-radius: 8px; border: none; font-weight: bold; }
        #ok-btn { background: #28a745; color: white; padding: 12px 50px; border-radius: 8px; border: 2px solid #fff; font-weight: bold; font-size: 18px; }
        #start-btn { background: #28a745; color: white; padding: 25px; border-radius: 15px; font-size: 22px; border: none; font-weight: bold; width: 85%; margin: 80px auto; }
        #result-box { display: none; margin-top: 15px; padding: 15px; border: 2px solid #ffd700; border-radius: 15px; text-align: left; background: rgba(0,0,0,0.85); line-height: 1.5; }
        .fact-box { margin-top: 10px; border-top: 1px solid #555; padding-top: 10px; color: #ddd; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h1>FASTEST FINGER FIRST</h1>
    <div id="q-count" style="color: #aaa; font-size: 12px;">प्रगति: 0/50</div>
    <div class="timer-val" id="timer">10</div>
    <button id="start-btn" onclick="initiateGame()">खेल शुरू करें</button>

    <div id="game-ui" style="display:none;">
        <p id="question-text"></p>
        <div class="options-grid" id="options-container"></div>
        <div id="current-tap" style="margin: 10px 0; color: yellow; font-weight: bold; min-height: 25px;">क्रम: </div>
        <div class="action-area" id="controls">
            <button id="clear-btn" onclick="resetSelection()">Clear</button>
            <button id="ok-btn" onclick="verifySequence()">OK</button>
        </div>
    </div>

    <div id="result-box">
        <h3 id="res-status" style="text-align:center;"></h3>
        <p><b>आपका उत्तर:</b> <span id="user-ans"></span></p>
        <div id="detailed-expl" class="fact-box"></div>
        <button class="btn" onclick="nextRound()" style="background:#fff; color:#000; margin: 15px auto; width: 100%;">अगला प्रश्न</button>
    </div>
</div>

<script>
    // 50 सवालों का पूरा सेट
    const questionsPool = [
        {q: "इन बॉलीवुड फिल्मों को रिलीज वर्ष के अनुसार लगाएं:", opt: ["मदर इंडिया", "शोले", "लगान", "दंगल"], correct: [0,1,2,3], expl: "मदर इंडिया ➔ शोले ➔ लगान ➔ दंगल"},
        {q: "इन त्योहारों को हिंदू कैलेंडर के अनुसार लगाएं:", opt: ["होली", "रामनवमी", "रक्षाबंधन", "दीपावली"], correct: [0,1,2,3], expl: "होली ➔ रामनवमी ➔ रक्षाबंधन ➔ दीपावली"},
        {q: "इन ऐतिहासिक शासकों को कालक्रम में लगाएं:", opt: ["अजातशत्रु", "अशोक", "अकबर", "शिवाजी"], correct: [0,1,2,3], expl: "अजातशत्रु ➔ अशोक ➔ अकबर ➔ शिवाजी"},
        {q: "इन संख्याओं को बढ़ते क्रम में लगाएं:", opt: ["सवा दो", "ढाई", "पौने तीन", "तीन"], correct: [0,1,2,3], expl: "2.25 ➔ 2.50 ➔ 2.75 ➔ 3.00"},
        {q: "इन शहरों को उत्तर से दक्षिण में लगाएं:", opt: ["श्रीनगर", "दिल्ली", "बेंगलुरु", "कन्याकुमारी"], correct: [0,1,2,3], expl: "श्रीनगर ➔ दिल्ली ➔ बेंगलुरु ➔ कन्याकुमारी"},
        {q: "इन भारतीय नोटों को मूल्य के अनुसार लगाएं:", opt: ["₹10", "₹50", "₹100", "₹200"], correct: [0,1,2,3], expl: "10 ➔ 50 ➔ 100 ➔ 200"},
        {q: "रामायण की घटनाओं को क्रम से लगाएं:", opt: ["ताड़का वध", "अहिल्या उद्धार", "धनुष भंग", "परशुराम मिलन"], correct: [0,1,2,3], expl: "ताड़का ➔ अहिल्या ➔ धनुष ➔ परशुराम"},
        {q: "इन ग्रहों को सूर्य से दूरी के अनुसार लगाएं:", opt: ["बुध", "शुक्र", "पृथ्वी", "मंगल"], correct: [0,1,2,3], expl: "बुध ➔ शुक्र ➔ पृथ्वी ➔ मंगल"},
        {q: "इन स्टोरेज इकाइयों को बढ़ते क्रम में लगाएं:", opt: ["KB", "MB", "GB", "TB"], correct: [0,1,2,3], expl: "KB ➔ MB ➔ GB ➔ TB"},
        {q: "इन जीवों को जीवन अवधि अनुसार लगाएं:", opt: ["मच्छर", "कुत्ता", "हाथी", "कछुआ"], correct: [0,1,2,3], expl: "मच्छर ➔ कुत्ता ➔ हाथी ➔ कछुआ"},
        {q: "इन क्रिकेट दिग्गजों के डेब्यू वर्ष को लगाएं:", opt: ["गावस्कर", "अजहर", "सचिन", "गांगुली"], correct: [0,1,2,3], expl: "गावस्कर ➔ अजहर ➔ सचिन ➔ गांगुली"},
        {q: "इन मुगल इमारतों को निर्माण के अनुसार लगाएं:", opt: ["हुमायूं मकबरा", "बुलंद दरवाजा", "ताजमहल", "बीबी का मकबरा"], correct: [0,1,2,3], expl: "हुमायूं ➔ बुलंद ➔ ताजमहल ➔ बीबी"},
        {q: "इन पर्वत चोटियों को ऊंचाई के अनुसार लगाएं:", opt: ["नंदा देवी", "कंचनजंगा", "के-2", "एवरेस्ट"], correct: [0,1,2,3], expl: "नंदा देवी ➔ कंचनजंगा ➔ के-2 ➔ एवरेस्ट"},
        {q: "इन सिख गुरुओं को क्रम में लगाएं:", opt: ["गुरु नानक", "गुरु अंगद", "गुरु अर्जुन", "गुरु गोविंद सिंह"], correct: [0,1,2,3], expl: "नानक ➔ अंगद ➔ अर्जुन ➔ गोविंद"},
        {q: "इन भारतीय राज्यों को क्षेत्रफल में लगाएं:", opt: ["राजस्थान", "मध्य प्रदेश", "महाराष्ट्र", "उत्तर प्रदेश"], correct: [0,1,2,3], expl: "राजस्थान ➔ MP ➔ महाराष्ट्र ➔ UP"},
        {q: "इन भाषाओं को बोलने वालों के अनुसार लगाएं:", opt: ["हिंदी", "बंगाली", "मराठी", "तेलुगु"], correct: [0,1,2,3], expl: "हिंदी ➔ बंगाली ➔ मराठी ➔ तेलुगु"},
        {q: "इन भारतीय राष्ट्रपतियों को क्रम में लगाएं:", opt: ["राजेंद्र प्रसाद", "राधाकृष्णन", "कलाम", "मुर्मू"], correct: [0,1,2,3], expl: "प्रसाद ➔ राधाकृष्णन ➔ कलाम ➔ मुर्मू"},
        {q: "इन बॉलीवुड एक्ट्रेस को डेब्यू क्रम में लगाएं:", opt: ["करिश्मा", "काजोल", "प्रियंका", "आलिया"], correct: [0,1,2,3], expl: "करिश्मा ➔ काजोल ➔ प्रियंका ➔ आलिया"},
        {q: "इन खेलों को खिलाड़ियों की संख्या में लगाएं:", opt: ["टेनिस", "बास्केटबॉल", "खो-खो", "क्रिकेट"], correct: [0,1,2,3], expl: "1 ➔ 5 ➔ 9 ➔ 11"},
        {q: "इन वैज्ञानिक खोजों को समय अनुसार लगाएं:", opt: ["पहिया", "बल्ब", "पेनिसिलिन", "इंटरनेट"], correct: [0,1,2,3], expl: "पहिया ➔ बल्ब ➔ पेनिसिलिन ➔ इंटरनेट"},
        {q: "इन नोबेल विजेताओं को वर्ष अनुसार लगाएं:", opt: ["सी.वी. रमन", "मदर टेरेसा", "अमर्त्य सेन", "अभिजीत बनर्जी"], correct: [0,1,2,3], expl: "रमन ➔ टेरेसा ➔ सेन ➔ बनर्जी"},
        {q: "इन मोबाइल जनरेशन को क्रम में लगाएं:", opt: ["2G", "3G", "4G", "5G"], correct: [0,1,2,3], expl: "2G ➔ 3G ➔ 4G ➔ 5G"},
        {q: "इन मुगल सम्राटों को क्रम में लगाएं:", opt: ["बाबर", "हुमायूँ", "अकबर", "जहाँगीर"], correct: [0,1,2,3], expl: "बाबर ➔ हुमायूँ ➔ अकबर ➔ जहाँगीर"},
        {q: "इन वाद्य यंत्रों को वर्णमाला क्रम में लगाएं:", opt: ["बांसुरी", "ढोलक", "सितार", "तबला"], correct: [0,1,2,3], expl: "बांसुरी ➔ ढोलक ➔ सितार ➔ तबला"},
        {q: "इन श्रेणियों को छोटे से बड़े क्रम में लगाएं:", opt: ["कोशिका", "ऊतक", "अंग", "शरीर"], correct: [0,1,2,3], expl: "कोशिका ➔ ऊतक ➔ अंग ➔ शरीर"},
        {q: "इन पर्वत श्रृंखलाओं को लंबाई में लगाएं:", opt: ["एंडीज", "रॉकीज", "हिमालय", "आल्प्स"], correct: [0,1,2,3], expl: "एंडीज ➔ रॉकीज ➔ हिमालय ➔ आल्प्स"},
        {q: "इन राज्यों को उत्तर से दक्षिण में लगाएं:", opt: ["हिमाचल", "उत्तर प्रदेश", "मध्य प्रदेश", "महाराष्ट्र"], correct: [0,1,2,3], expl: "हिमाचल ➔ UP ➔ MP ➔ महाराष्ट्र"},
        {q: "इन मिशनों को वर्ष के अनुसार लगाएं:", opt: ["अपोलो 11", "वायेजर 1", "मार्स पाथफाइंडर", "जेम्स वेब"], correct: [0,1,2,3], expl: "1969 ➔ 1977 ➔ 1997 ➔ 2021"},
        {q: "इन तत्वों को परमाणु क्रमांक में लगाएं:", opt: ["हाइड्रोजन", "हीलियम", "लिथियम", "बेरिलियम"], correct: [0,1,2,3], expl: "1 ➔ 2 ➔ 3 ➔ 4"},
        {q: "इन स्टेडियमों को दर्शक क्षमता में लगाएं:", opt: ["मोदी स्टेडियम", "मेलबर्न", "ईडन गार्डन्स", "लॉर्ड्स"], correct: [0,1,2,3], expl: "मोदी ➔ मेलबर्न ➔ ईडन ➔ लॉर्ड्स"},
        {q: "इन ऊंचाइयों को बढ़ते क्रम में लगाएं:", opt: ["पेड़", "पहाड़ी", "पर्वत", "एवरेस्ट"], correct: [0,1,2,3], expl: "पेड़ ➔ पहाड़ी ➔ पर्वत ➔ एवरेस्ट"},
        {q: "इन ग्रहों को आकार में लगाएं:", opt: ["बृहस्पति", "शनि", "पृथ्वी", "मंगल"], correct: [0,1,2,3], expl: "बृहस्पति ➔ शनि ➔ पृथ्वी ➔ मंगल"},
        {q: "इन विटामिनों को वर्णमाला में लगाएं:", opt: ["विटामिन A", "विटामिन B", "विटामिन C", "विटामिन D"], correct: [0,1,2,3], expl: "A ➔ B ➔ C ➔ D"},
        {q: "इन सोशल मीडिया एप्स को लॉन्च में लगाएं:", opt: ["फेसबुक", "यूट्यूब", "व्हाट्सएप", "इंस्टाग्राम"], correct: [0,1,2,3], expl: "2004 ➔ 2005 ➔ 2009 ➔ 2010"},
        {q: "इन राज्यों को जनसंख्या में लगाएं:", opt: ["उत्तर प्रदेश", "महाराष्ट्र", "बिहार", "पश्चिम बंगाल"], correct: [0,1,2,3], expl: "UP ➔ महाराष्ट्र ➔ बिहार ➔ WB"},
        {q: "इन महासागरों को क्षेत्रफल में लगाएं:", opt: ["प्रशांत", "अटलांटिक", "हिंद", "आर्कटिक"], correct: [0,1,2,3], expl: "प्रशांत ➔ अटलांटिक ➔ हिंद ➔ आर्कटिक"},
        {q: "इन संख्याओं को बढ़ते क्रम में लगाएं:", opt: ["शून्य", "सौ", "हजार", "लाख"], correct: [0,1,2,3], expl: "0 ➔ 100 ➔ 1000 ➔ 100000"},
        {q: "इन महापुरुषों को जन्म वर्ष में लगाएं:", opt: ["राममोहन राय", "विवेकानंद", "गांधीजी", "भगत सिंह"], correct: [0,2,1,3], expl: "राममोहन राय ➔ विवेकानंद ➔ गांधीजी ➔ भगत सिंह"},
        {q: "इन भारतीय राज्यों को तटरेखा में लगाएं:", opt: ["गुजरात", "आंध्र प्रदेश", "तमिलनाडु", "महाराष्ट्र"], correct: [0,1,2,3], expl: "गुजरात ➔ आंध्र प्रदेश ➔ तमिलनाडु ➔ महाराष्ट्र"},
        {q: "इन क्रिकेट वर्ल्ड कप वर्षों को लगाएं:", opt: ["1975", "1983", "1987", "2019"], correct: [0,1,2,3], expl: "1975 ➔ 1983 ➔ 1987 ➔ 2019"},
        {q: "इन ऐतिहासिक घटनाओं को क्रम में लगाएं:", opt: ["प्रथम विश्व युद्ध", "द्वितीय विश्व युद्ध", "आज़ादी", "चंद्रयान-1"], correct: [0,1,2,3], expl: "1914 ➔ 1939 ➔ 1947 ➔ 2008"},
        {q: "इन भारतीय करेंसी को मूल्य में लगाएं:", opt: ["10", "50", "200", "500"], correct: [0,1,2,3], expl: "10 ➔ 50 ➔ 200 ➔ 500"},
        {q: "इन खेलों को खिलाड़ियों की संख्या में लगाएं:", opt: ["टेनिस", "बास्केटबॉल", "खो-खो", "क्रिकेट"], correct: [0,1,2,3], expl: "1 ➔ 5 ➔ 9 ➔ 11"},
        {q: "इन शहरों को पश्चिम से पूर्व लगाएं:", opt: ["अहमदाबाद", "भोपाल", "वाराणसी", "कोलकाता"], correct: [0,1,2,3], expl: "अहमदाबाद ➔ भोपाल ➔ वाराणसी ➔ कोलकाता"},
        {q: "इन मुगल सम्राटों को लगाएं:", opt: ["बाबर", "हुमायूँ", "अकबर", "जहाँगीर"], correct: [0,1,2,3], expl: "बाबर ➔ हुमायूँ ➔ अकबर ➔ जहाँगीर"},
        {q: "इन वाद्य यंत्रों को लगाएं:", opt: ["बांसुरी", "ढोलक", "सितार", "तबला"], correct: [0,1,2,3], expl: "बांसुरी ➔ ढोलक ➔ सितार ➔ तबला"},
        {q: "इन श्रेणियों को लगाएं:", opt: ["कोशिका", "ऊतक", "अंग", "शरीर"], correct: [0,1,2,3], expl: "कोशिका ➔ ऊतक ➔ अंग ➔ शरीर"},
        {q: "इन राज्यों को उत्तर से दक्षिण लगाएं:", opt: ["हिमाचल", "उत्तर प्रदेश", "मध्य प्रदेश", "महाराष्ट्र"], correct: [0,1,2,3], expl: "हिमाचल ➔ UP ➔ MP ➔ महाराष्ट्र"},
        {q: "इन मिशनों को लगाएं:", opt: ["अपोलो 11", "वायेजर 1", "मार्स पाथफाइंडर", "जेम्स वेब"], correct: [0,1,2,3], expl: "1969 ➔ 1977 ➔ 1997 ➔ 2021"},
        {q: "इन तत्वों को लगाएं:", opt: ["हाइड्रोजन", "हीलियम", "लिथियम", "बेरिलियम"], correct: [0,1,2,3], expl: "1 ➔ 2 ➔ 3 ➔ 4"}
    ];

    let remainingIndices = questionsPool.map((_, i) => i);
    let currentQ, userSeq = [], shuffledOptions = [], correctOrderString = "", timeLeft = 10, isRunning = false, clockInt;

    function initiateGame() {
        document.getElementById('start-btn').style.display = "none";
        document.getElementById('game-ui').style.display = "block";
        nextRound();
    }

    function nextRound() {
        if(remainingIndices.length === 0) { alert("शानदार! 50 सवाल पूरे।"); location.reload(); return; }
        let randomIndex = Math.floor(Math.random() * remainingIndices.length);
        let qIndex = remainingIndices.splice(randomIndex, 1)[0];
        currentQ = questionsPool[qIndex];

        // रैंडम शफल
        shuffledOptions = currentQ.opt.map((text, index) => ({ text, originalIndex: index }))
                                      .sort(() => Math.random() - 0.5);
        
        correctOrderString = currentQ.correct.map(val => {
            return shuffledOptions.findIndex(opt => opt.originalIndex === val);
        }).map(idx => String.fromCharCode(65 + idx)).join("");

        userSeq = []; timeLeft = 10; isRunning = false;
        document.getElementById('timer').innerText = "10";
        document.getElementById('result-box').style.display = "none";
        document.getElementById('game-ui').style.opacity = "1";
        document.getElementById('options-container').style.display = "none";
        document.getElementById('controls').style.display = "none";
        document.getElementById('current-tap').innerText = "क्रम: ";
        document.getElementById('q-count').innerText = "प्रगति: " + (50 - remainingIndices.length) + "/50";
        document.getElementById('question-text').innerText = currentQ.q;
        
        let htmlBuild = "";
        shuffledOptions.forEach((o, i) => {
            let label = String.fromCharCode(65 + i);
            htmlBuild += `<button class="btn" id="btn-${label}" onclick="tapOption('${label}', '${o.text}')">${label}: ${o.text}</button>`;
        });
        document.getElementById('options-container').innerHTML = htmlBuild;
        
        setTimeout(() => {
            document.getElementById('options-container').style.display = "grid";
            document.getElementById('controls').style.display = "flex";
            isRunning = true;
            clockInt = setInterval(() => {
                if(timeLeft > 0 && isRunning) { timeLeft--; document.getElementById('timer').innerText = timeLeft; }
                else if(timeLeft === 0 && isRunning) { endShow("समय समाप्त! ⏰"); }
            }, 1000);
        }, 5000);
    }

    function tapOption(label, name) {
        if(!isRunning || userSeq.includes(label) || userSeq.length >= 4) return;
        userSeq.push(label);
        document.getElementById("btn-" + label).classList.add('selected');
        document.getElementById('current-tap').innerText = "क्रम: " + userSeq.join(' ➔ ');
    }

    function resetSelection() {
        if(!isRunning) return;
        userSeq = [];
        document.getElementById('current-tap').innerText = "क्रम: ";
        document.querySelectorAll('.btn').forEach(b => b.classList.remove('selected'));
    }

    function verifySequence() { if(userSeq.length === 4) endShow(); }

    function endShow(msg) {
        isRunning = false; clearInterval(clockInt);
        const winResult = userSeq.join("") === correctOrderString;
        document.getElementById('game-ui').style.opacity = "0.3";
        document.getElementById('result-box').style.display = "block";
        document.getElementById('res-status').innerText = msg || (winResult ? "अद्भुत! सही जवाब! ✅" : "गलत जवाब! ❌");
        document.getElementById('res-status').style.color = winResult ? "#2ecc71" : "#e74c3c";
        document.getElementById('user-ans').innerText = userSeq.join(" ➔ ");
        document.getElementById('detailed-expl').innerHTML = currentQ.expl;
    }
</script>
</body>
</html>
